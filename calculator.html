<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    
    <!-- PHẦN 1: CSS (Trang trí giao diện) -->
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .calculator {
            background-color: #222;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            width: 260px;
        }

        /* Màn hình hiển thị kết quả */
        #display {
            width: 100%;
            height: 50px;
            font-size: 24px;
            text-align: right;
            margin-bottom: 15px;
            padding: 10px;
            box-sizing: border-box;
            border: none;
            border-radius: 6px;
            background-color: #eee;
            color: #000;
        }

        /* Lưới chứa các nút bấm (4 cột) */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        /* Kiểu dáng chung cho nút */
        button {
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #444;
            color: white;
        }

        button:hover {
            background-color: #666;
        }

        /* Màu riêng cho các nút phép tính */
        .operator {
            background-color: #ff9500;
        }
        .operator:hover {
            background-color: #e08200;
        }

        /* Màu riêng cho nút xóa (C) */
        .clear {
            background-color: #ff3b30;
        }
        .clear:hover {
            background-color: #d63026;
        }
    </style>
</head>
<body>

    <!-- PHẦN 2: HTML (Cấu trúc khung máy tính) -->
    <div class="calculator">
        <!-- Ô nhập liệu chỉ đọc (readonly) làm màn hình -->
        <input type="text" id="display" readonly>
        
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendValue('/')">/</button>
            <button class="operator" onclick="appendValue('*')">*</button>
            <button class="operator" onclick="deleteLast()">⌫</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('-')">-</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="calculate()">=</button>

            <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
            <button onclick="appendValue('.')">.</button>
        </div>
    </div>

    <!-- PHẦN 3: JAVASCRIPT (Xử lý logic tính toán) -->
    <script>
        const display = document.getElementById('display');

        // 1. Hàm thêm số hoặc dấu phép tính vào màn hình
        function appendValue(value) {
            display.value += value;
        }

        // 2. Hàm xóa toàn bộ màn hình (nút C)
        function clearDisplay() {
            display.value = '';
        }

        // 3. Hàm xóa 1 ký tự cuối cùng (nút ⌫)
        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        // 4. Hàm tính toán kết quả (nút =)
        function calculate() {
            try {
                // Hàm eval() tự động tính toán chuỗi biểu thức toán học
                display.value = eval(display.value);
            } catch (error) {
                display.value = 'Lỗi';
            }
        }
    </script>

</body>
</html>
