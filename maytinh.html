<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>maytinhcamtay</title>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" readonly>

        <div class="button">
            <button class="XoaManHinh" onclick="XoaManHinh()">C</button>
            <button class="PhepToan" onclick="ThemKiTu('/')">/</button>
            <button class="PhepToan" onclick="ThemKiTu('*')">*</button>
            <button class="PhepToan" onclick="Xoa1KiTu()">⌫</button>

            <button class="So" onclick="ThemKiTu('7')">7</button>
            <button class="So" onclick="ThemKiTu('8')">8</button>
            <button class="So" onclick="ThemKiTu('9')">9</button>
            <button class="PhepToan" onclick="ThemKiTu('-')">-</button>       

            <button class="So" onclick="ThemKiTu('4')">4</button>
            <button class="So" onclick="ThemKiTu('5')">5</button>
            <button class="So" onclick="ThemKiTu('6')">6</button>
            <button class="PhepToan" onclick="ThemKiTu('+')">+</button>  
            
            <button class="So" onclick="ThemKiTu('1')">1</button>
            <button class="So" onclick="ThemKiTu('2')">2</button>
            <button class="So" onclick="ThemKiTu('3')">3</button>
            <button class="Bang" onclick="TinhToan()">=</button>  

            <button class="So" onclick="ThemKiTu('0')">0</button>
            <button class="So" onclick="ThemKiTu('.')">.</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display')

        function ThemKiTu(GiaTri){
            display.value += GiaTri;
        }

        function XoaManHinh(){
            display.value = "";
        }

        function Xoa1KiTu(){
            display.value = display.value.slice(0, -1);
        }

        function TinhToan(){
            try{
                display.value = eval(display.value)
            }
            catch (error) {
                display.value = "Lỗi";
            }
        }
    </script>
</body>
</html>
